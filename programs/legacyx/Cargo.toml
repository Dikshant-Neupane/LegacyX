[package]
name = "legacyx"
version = "0.2.0"
description = "SoulVault — Self-sovereign digital legacy vault on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "legacyx"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.0" }
serde = { workspace = true }
